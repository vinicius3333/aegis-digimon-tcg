# Standalone persistent S3 service. Never included in per-release Compose stacks.
# Install with tools/storage/install-vps-replays.sh on the VPS.
services:
  replay-storage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: aegis-replay-storage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    env_file: ${AEGIS_REPLAY_DATA_ROOT:-/opt/aegis-replays}/garage.env
    volumes:
      - ${AEGIS_REPLAY_DATA_ROOT:-/opt/aegis-replays}/garage.toml:/etc/garage.toml:ro
      - ${AEGIS_REPLAY_DATA_ROOT:-/opt/aegis-replays}/meta:/var/lib/garage/meta
      - ${AEGIS_REPLAY_DATA_ROOT:-/opt/aegis-replays}/data:/var/lib/garage/data
      - ${AEGIS_REPLAY_DATA_ROOT:-/opt/aegis-replays}/snapshots:/var/lib/garage/snapshots
    networks:
      default:
        aliases: [aegis-replay-s3]
    # Neither S3 nor the admin/RPC APIs are published to the host or internet.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
networks:
  default:
    name: ${AEGIS_REPLAY_NETWORK:-aegis_default}
    external: true
