# Production stack for a self-hosted deployment that sits behind an external
# reverse proxy. The proxy terminates TLS and forwards to the `aegis-web`
# alias on the shared network named by AEGIS_EDGE_NETWORK, so no host ports
# are published here.
#
# The API runs as three processes, not one. A Colyseus process is single-threaded, so one
# process uses one core no matter how many the host has; the three share their matchmaking
# state through Redis and each advertises its own public path (`/p1`, `/p2`, `/p3`) so the
# client SDK connects straight to the process that owns its room. `docker/Caddyfile` routes
# those paths, and every other request is load-balanced across the three.
#
# Every deployment-specific value comes from the environment. Required:
# AEGIS_PUBLIC_URL, AEGIS_PUBLIC_WS_URL, AEGIS_EDGE_NETWORK, POSTGRES_PASSWORD,
# RESEND_API_KEY, AEGIS_EMAIL_FROM, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET.
# Optional: POSTGRES_DB, POSTGRES_USER, AEGIS_REVISION, AEGIS_DEPLOYMENT_MODE,
# GITHUB_TOKEN, GITHUB_BUG_REPOSITORY, GITHUB_BUG_LABELS (player bug reports are
# filed as GitHub issues; without the token and the repository the in-game form
# tells players to use Discord instead), AEGIS_TRUSTED_PROXY_HOPS (proxies in
# front of the API, which is how an anonymous reporter's address is read).
#
# For local development use docker-compose.yml instead.

# One definition, three processes. Only AEGIS_PROCESS_PATH differs, and it has to: two
# processes advertising the same public address would hand clients seat reservations that
# live on the other one.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  # Three processes on a four-core host: enough for each to saturate a core under load
  # while leaving the host a core for Postgres, Redis and the proxy.
  cpus: 1.25
  mem_limit: 1500m
  environment: &api-env
    NODE_ENV: production
    PORT: "2567"
    DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-aegis}
    AEGIS_WEB_URL: ${AEGIS_PUBLIC_URL:?AEGIS_PUBLIC_URL must be set}
    AEGIS_API_URL: ${AEGIS_PUBLIC_URL}
    AEGIS_REVISION: ${AEGIS_REVISION:-production}
    AEGIS_REDIS_URL: redis://redis:6379
    RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
    AEGIS_EMAIL_FROM: ${AEGIS_EMAIL_FROM:?AEGIS_EMAIL_FROM must be set}
    DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
    DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
    DISCORD_REDIRECT_URI: ${AEGIS_PUBLIC_URL}/auth/discord/callback
    ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITHUB_BUG_REPOSITORY: ${GITHUB_BUG_REPOSITORY:-}
    GITHUB_BUG_LABELS: ${GITHUB_BUG_LABELS:-}
    AEGIS_TRUSTED_PROXY_HOPS: ${AEGIS_TRUSTED_PROXY_HOPS:-2}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  # Docker keeps container stdout forever by default; the app rotates its own file log and
  # this bounds the other half.
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  api:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p1

  api2:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p2

  api3:
    <<: *api
    environment:
      <<: *api-env
      AEGIS_PROCESS_PATH: p3

  # Matchmaking state: room listings, seat reservations and private room codes.
  #
  # Appended to disk, though none of it outlives a deploy. A Redis that comes back empty while
  # the API processes keep running leaves every match in progress invisible to matchmaking —
  # its room code stops resolving and joinById fails — until each room happens to write again.
  # The append log costs nothing and closes that window on a restart. It lives in the container
  # layer with no volume on purpose: recreating this container is part of a deploy, which
  # recreates the API processes too, and their rooms are gone at that point anyway.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 1
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AEGIS_API_URL: ${AEGIS_PUBLIC_WS_URL:?AEGIS_PUBLIC_WS_URL must be set}
        VITE_AEGIS_REVISION: ${AEGIS_REVISION:-production}
        VITE_AEGIS_DEPLOYMENT_MODE: ${AEGIS_DEPLOYMENT_MODE:-direct}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    expose:
      - "80"
    networks:
      default:
        aliases:
          - aegis-web

networks:
  default:
    external: true
    name: ${AEGIS_EDGE_NETWORK:?AEGIS_EDGE_NETWORK must be set}

volumes:
  postgres_data:
