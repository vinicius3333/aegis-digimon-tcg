name: Simulator verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check
      - name: Install rules PDF extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fast pull request checks
        if: github.event_name == 'pull_request'
        run: pnpm verify:simulator
      - name: API tests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @aegis/api test
      - name: Scheduled and manual deep checks
        if: github.event_name != 'pull_request'
        run: pnpm verify:simulator:deep

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis_sealed_test
          POSTGRES_PASSWORD: ci-only
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TESTS: "1"
      PGPASSWORD: ci-only
      POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:55439/aegis_sealed_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/shared build
      - run: pnpm --filter @aegis/api build
      - name: PostgreSQL and Sealed API tests
        if: matrix.suite == 'api'
        working-directory: apps/api
        run: |
          shopt -s globstar nocaseglob
          pnpm test:postgres src/db/migrator.accountContention src/**/*sealed*.test.ts --maxWorkers=1
      - run: pnpm --filter @aegis/web exec playwright install --with-deps chromium
        if: matrix.suite == 'browser'
      - name: Sealed browser tests
        if: matrix.suite == 'browser'
        env:
          AEGIS_CARD_IMAGE_ORIGIN: https://web-garage.takaotaku.de
        working-directory: apps/web
        run: |
          failed=0
          for spec in e2e/*sealed*.spec.ts; do
            pnpm exec playwright test "$spec" --output "$RUNNER_TEMP/${spec##*/}" || failed=1
          done
          exit "$failed"
