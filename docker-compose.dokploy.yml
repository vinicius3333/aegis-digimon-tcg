name: aegis-apps

# Dokploy-managed production fallback. Each push to master is built on the VPS;
# the web bundle uses the direct/single-compose connection path (no blue/green
# deployment manifest). The external network is pinned so the host edge can keep
# resolving `aegis-web`.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "2567"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: aegis
      PGUSER: aegis
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AEGIS_WEB_URL: https://aegis-digi.online
      AEGIS_API_URL: https://aegis-digi.online
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      AEGIS_EMAIL_FROM: "Aegis <login@mail.aegis-digi.online>"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
      DISCORD_REDIRECT_URI: https://aegis-digi.online/auth/discord/callback
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AEGIS_API_URL: wss://aegis-digi.online
        VITE_AEGIS_REVISION: development
        VITE_AEGIS_DEPLOYMENT_MODE: direct
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    expose:
      - "80"
    networks:
      default:
        aliases:
          - aegis-web

networks:
  default:
    external: true
    name: aegis_default

volumes:
  postgres_data:
